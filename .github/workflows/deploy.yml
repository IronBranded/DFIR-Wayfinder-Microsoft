name: Deploy Zensical site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
          restore-keys: |
            zensical-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate tags and backlinks
        run: |
          python3 scripts/tag_pages.py
          python3 scripts/generate_backlinks.py

      - name: Build (strict)
        run: zensical build -s

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
