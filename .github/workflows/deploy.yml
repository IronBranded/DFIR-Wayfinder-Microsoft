name: Deploy Zensical site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Scoped specifically to Pages deployment, not general repo contents write -
# this is what actions/deploy-pages actually needs, and side-steps the
# "Workflow permissions" repo-wide default that broke the previous
# peaceiris/actions-gh-pages-based version of this file.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
          restore-keys: |
            zensical-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate tags and backlinks
        run: |
          python3 scripts/tag_pages.py
          python3 scripts/generate_backlinks.py

      - name: Build (strict)
        run: zensical build -s

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
